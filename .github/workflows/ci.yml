name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxcb1-dev libfreetype-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Verify desktop build, headless game, and Bevy runner
        run: python scripts/verify.py

      - name: Check Linux installer and update worker
        if: runner.os == 'Linux'
        run: |
          for script in docs/install.sh docs/uninstall.sh crates/steelgum-update/src/update-linux.sh; do
            bash -n "$script"
          done
          python scripts/test_install.py

      - name: Check Windows installer and update worker syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('docs/install.ps1', 'docs/uninstall.ps1', 'crates/steelgum-update/src/update-windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) { throw ($parseErrors -join [Environment]::NewLine) }
          }
