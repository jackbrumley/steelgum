[workspace]
resolver = "3"
members = ["crates/steelgum", "examples/door-game", "crates/steelgum-update"]
exclude = ["apps/door-game-bevy"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
