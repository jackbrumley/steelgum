[package]
name = "door-game-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# Keep headless authoring and game tests independent of the graphics dependencies.
[workspace]
resolver = "3"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "default_app",
    "3d_bevy_render",
    "bevy_winit",
    "multi_threaded",
    "x11",
    "wayland",
] }
door-game = { path = "../../examples/door-game" }
steelgum-update = { path = "../../crates/steelgum-update" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = { version = "0.17", features = ["common-controls-v6"] }

[[bin]]
name = "steelgum"
path = "src/main.rs"
